name: Check for PowerModeManager updates

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-cask:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Update version and checksum
        id: update
        run: scripts/update-cask.sh
      - name: Open or update Cask pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-powermodemanager-cask
          delete-branch: true
          add-paths: Casks/powermodemanager.rb
          commit-message: "Update PowerModeManager to ${{ steps.update.outputs.version }}"
          title: "Update PowerModeManager to ${{ steps.update.outputs.version }}"
          body: "Updates the Cask version and SHA-256 from the latest published stable release. Review the release before merging."
